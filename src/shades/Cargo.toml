[package]
name = "shades"
version = "0.1.0"
edition = "2021"
description = "Animated shader wallpaper for wlroots-style Wayland compositors"

[dependencies]
libc = "0.2"
khronos-egl = { version = "6", features = ["dynamic"] }
glow = "0.16"
nix = { version = "0.29", features = ["signal", "poll"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-client = "0.31"
wayland-egl = "0.32"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
opt-level = 2
lto = true
strip = true
